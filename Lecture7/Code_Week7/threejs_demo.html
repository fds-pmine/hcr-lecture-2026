<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HCR Three.js demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  #hud { position: fixed; top: 8px; left: 12px; font-size: 13px; opacity: 0.85; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">Rotating ellipsoid head with hair-like lines. Three.js via CDN, no build step.</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160/build/three.module.js";

// --- scene, camera, renderer ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 5);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// --- lights ---
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(3, 4, 5);
scene.add(key);

// --- a "head" as an ellipsoid: a sphere with non-uniform scale ---
const headRadii = new THREE.Vector3(0.9, 1.1, 0.95);
const head = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0xefc8a8, roughness: 0.6 }),
);
head.scale.copy(headRadii);
head.position.y = 0.5;
scene.add(head);

// --- "hairs" as short line segments along the outward ellipsoid normal ---
const hairGroup = new THREE.Group();
hairGroup.position.copy(head.position);
const hairLength = 0.25;
const hairMaterial = new THREE.LineBasicMaterial({ color: 0x222222 });

for (let i = 0; i < 220; i++) {
  // Sample a point on the unit sphere, then stretch by headRadii to get the surface point.
  const u = Math.random() * 2 - 1;
  const phi = Math.random() * Math.PI * 2;
  const s = Math.sqrt(1 - u * u);
  const unit = new THREE.Vector3(s * Math.cos(phi), u, s * Math.sin(phi));

  // Only put hair on the top half of the head.
  if (unit.y < -0.1) continue;

  const surface = new THREE.Vector3(
    unit.x * headRadii.x,
    unit.y * headRadii.y,
    unit.z * headRadii.z,
  );

  // Outward normal at an ellipsoid point: gradient of the implicit form, normalized.
  const normal = new THREE.Vector3(
    surface.x / (headRadii.x * headRadii.x),
    surface.y / (headRadii.y * headRadii.y),
    surface.z / (headRadii.z * headRadii.z),
  ).normalize();

  const tip = surface.clone().addScaledVector(normal, hairLength);

  const geom = new THREE.BufferGeometry().setFromPoints([surface, tip]);
  hairGroup.add(new THREE.Line(geom, hairMaterial));
}
scene.add(hairGroup);

// --- ground plane for context ---
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(3, 48),
  new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 1 }),
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.8;
scene.add(floor);

// --- animation loop ---
renderer.setAnimationLoop(() => {
  head.rotation.y += 0.005;
  hairGroup.rotation.y += 0.005;
  renderer.render(scene, camera);
});

// --- resize handling ---
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
