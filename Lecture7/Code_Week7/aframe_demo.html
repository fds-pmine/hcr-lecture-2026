<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HCR A-Frame demo</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  #hud { position: fixed; top: 8px; left: 12px; font-size: 13px; opacity: 0.85;
         pointer-events: none; color: #eee; font-family: sans-serif; z-index: 10; }
</style>
</head>
<body>
<div id="hud">A-Frame: the whole scene is HTML. Drag to look around. Press Ctrl+Alt+I for the inspector.</div>
<a-scene background="color: #111">
  <!-- "Head" as a stretched sphere with non-uniform scale -->
  <a-sphere position="0 1.5 -3"
            radius="1"
            scale="0.9 1.1 0.95"
            color="#EFC8A8"></a-sphere>

  <!-- A flat disc on top of the head to suggest where hair is anchored -->
  <a-cylinder position="0 2.6 -3"
              radius="0.6"
              height="0.04"
              color="#222"></a-cylinder>

  <!-- Floor and sky -->
  <a-cylinder position="0 0.2 -3"
              radius="3"
              height="0.02"
              color="#333"></a-cylinder>
  <a-sky color="#111"></a-sky>

  <!-- Default camera with WASD + mouse look -->
  <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
</a-scene>
</body>
</html>
